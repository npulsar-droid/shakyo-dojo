<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写経道場 TS別館</title>
<style>
  :root{
    --bg:#0c0c11; --panel:#15151d; --line:#26263340; --ink:#e9e9f0;
    --dim:#6b6b7d; --pink:#ff5c8a; --cyan:#5cc8ff; --green:#7cffb0; --err:#ff4d5e;
    --mono:"SF Mono", Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;}
  header{padding:18px 20px 6px;}
  h1{margin:0;font-size:20px;letter-spacing:.04em}
  h1 span{color:var(--pink)}
  h1 .ts{color:#111;background:var(--cyan);border-radius:6px;
    padding:1px 7px;font-size:13px;margin-left:8px;vertical-align:2px}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .sub a{color:var(--cyan);text-decoration:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.active{border-color:var(--pink);color:var(--pink)}
  .chip .ck{color:var(--green);margin-left:6px}
  main{display:flex;gap:16px;padding:8px 20px 32px;flex-wrap:wrap}
  .col{flex:1 1 380px;min-width:300px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{margin:0;font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .note{color:var(--dim);font-size:12.5px;padding:10px 16px 0;line-height:1.6}
  /* code 写経 */
  .code{font-family:var(--mono);font-size:14px;line-height:1.75;padding:14px 16px 18px;
    white-space:pre-wrap;outline:none;cursor:text;tab-size:2;min-height:180px}
  .code:focus{box-shadow:inset 0 0 0 2px #ff5c8a33}
  .code .ch{color:var(--dim)}
  .code .done{color:var(--ink)}
  .code .auto{color:#3a3a4a}
  .code .cur{background:var(--pink);color:#111;border-radius:2px}
  .code.completed .cur{background:transparent;color:var(--ink)}
  .code.err .cur{background:var(--err);color:#fff;animation:shake .18s}
  @keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .bar{display:flex;gap:10px;align-items:center;padding:0 16px 14px;flex-wrap:wrap}
  .btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .btn.p{background:var(--pink);color:#111}
  .btn.g{background:#23232e;color:var(--ink);border:1px solid var(--line)}
  .stat{color:var(--dim);font-size:12px;margin-left:auto}
  .banner{color:var(--green);font-weight:700;font-size:13px}
  /* result */
  .stagewrap{padding:0}
  iframe{width:100%;height:300px;border:0;background:#0d0d12;display:block}
  .hint{color:var(--dim);font-size:12px;text-align:center;padding:120px 20px}
  /* 型を剥がした後のJS */
  .jscard{margin-top:16px;display:none}
  .jsout{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.7;
    color:var(--cyan);padding:14px 16px 18px;white-space:pre-wrap;tab-size:2}
  footer{color:var(--dim);font-size:11.5px;text-align:center;padding:0 20px 24px}
</style>
</head>
<body>
<header>
  <h1>写経<span>道場</span><span class="ts">TS別館</span></h1>
  <div class="sub">お手本の TypeScript を、一字ずつ写す。写し終えたら —— 型が剥がれて、JS として動き出す。<a href="index.html">JS 本館へ →</a>　<a href="py.html" style="color:var(--yellow,#ffd15c)">Py別館へ →</a></div>
</header>
<div class="chips" id="chips"></div>
<main>
  <div class="col">
    <div class="card">
      <h2><span id="lessonTitle">—</span><span class="banner" id="banner"></span></h2>
      <div class="note" id="note"></div>
      <div class="code" id="code" tabindex="0"></div>
      <div class="bar">
        <button class="btn g" id="peek">完成形をチラ見 👀</button>
        <button class="btn g" id="reset">やり直す ↺</button>
        <span class="stat" id="stat"></span>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <h2>実行結果 <span class="stat" id="runlabel"></span></h2>
      <div class="stagewrap"><div class="hint" id="hint">写し終える（or チラ見）と、ここで動くよ 🎬</div><iframe id="frame" style="display:none"></iframe></div>
    </div>
    <div class="card jscard" id="jscard">
      <h2>型を剥がすと、こうなる <span class="stat">← 実際に走っているのは、この JS</span></h2>
      <pre class="jsout" id="jsout"></pre>
    </div>
  </div>
</main>
<footer>写経道場 TS別館 · ローカル単一HTML · 進捗は自動保存 · 型は実行時には消える · 薄い字（インデント・日本語）は自動で進む</footer>

<script>
"use strict";

/* ---- お手本（TypeScript。剥がすと自己完結JSとして動く小品） ---- */
const LESSONS = [
  { id:"greet", title:"其の一 · 型を、名乗る", stage:false,
    note:"name: string「引数は文字列」、): string「返すのも文字列」。関数の入口と出口に、型で名札を付ける。as は「null じゃない、要素だと私が保証する」の合図。",
    code:
`const app = document.getElementById("app") as HTMLElement;
function greet(name: string): string {
  return "こんにちは、" + name + "さん";
}
app.textContent = greet("写経人");` },

  { id:"point", title:"其の二 · interface で形を決める", stage:true,
    note:"「Point とは、x と y を持つもの」と、先に形を宣言してから使う。その座標に、円がひとつ。",
    code:
`interface Point {
  x: number;
  y: number;
}
const p: Point = { x: 160, y: 120 };
const c = document.getElementById("stage") as HTMLCanvasElement;
const ctx = c.getContext("2d") as CanvasRenderingContext2D;
ctx.fillStyle = "hotpink";
ctx.beginPath();
ctx.arc(p.x, p.y, 60, 0, Math.PI * 2);
ctx.fill();` },

  { id:"mood", title:"其の三 · union で選択肢を縛る", stage:false,
    note:"Mood に入れていいのは \"up\" か \"down\" だけ。それ以外はコンパイルで怒られる。ボタンで気分と背景色が切り替わる。",
    code:
`type Mood = "up" | "down";
let mood: Mood = "up";
const app = document.getElementById("app") as HTMLElement;
const btn = document.createElement("button");
function paint(): void {
  btn.textContent = mood === "up" ? "アゲ ↑" : "サゲ ↓";
  document.body.style.background = mood === "up" ? "#16324a" : "#3a1230";
}
btn.onclick = function () {
  mood = mood === "up" ? "down" : "up";
  paint();
};
app.appendChild(btn);
paint();` },

  { id:"generic", title:"其の四 · ジェネリクス <T>", stage:false,
    note:"first<T> は「どんな型でも受けるが、入れた型のまま返す」約束。文字列の配列でも、数値の配列でも、同じ first が効く。",
    code:
`const app = document.getElementById("app") as HTMLElement;
function first<T>(arr: T[]): T {
  return arr[0];
}
const words: string[] = ["写経", "道場", "TS"];
const nums: number[] = [7, 5, 3];
app.textContent = first(words) + " / " + first(nums);` },

  { id:"enum", title:"其の五 · enum で並べる", stage:false,
    note:"曜日のような「決まった仲間」に、enum で名前をつける。ループで全員点呼。剥がすと、ただのオブジェクトになる。",
    code:
`enum Day {
  Sun = "日", Mon = "月", Tue = "火", Wed = "水",
  Thu = "木", Fri = "金", Sat = "土",
}
const app = document.getElementById("app") as HTMLElement;
for (const d of Object.values(Day)) {
  const line = document.createElement("div");
  line.textContent = d + "ようび";
  app.appendChild(line);
}` },
];

/* ============ 型ストリッパー ============
   ts-trainer と同方式。お手本は「これで確実に正しくJS化できる範囲」に限定してある。 */

function skipStringRaw(s, i) {
  const q = s[i]; i++;
  while (i < s.length) {
    if (s[i] === "\\") { i += 2; continue; }
    if (s[i] === q) return i + 1;
    if (q === "`" && s[i] === "$" && s[i + 1] === "{") {
      let d = 1; i += 2;
      while (i < s.length && d > 0) {
        if (s[i] === "\\") i++;
        else if (s[i] === "{") d++;
        else if (s[i] === "}") d--;
        i++;
      }
      continue;
    }
    i++;
  }
  return i;
}
function skipComment(s, i) {
  if (s[i + 1] === "/") { while (i < s.length && s[i] !== "\n") i++; return i; }
  i += 2;
  while (i < s.length && !(s[i] === "*" && s[i + 1] === "/")) i++;
  return Math.min(i + 2, s.length);
}

// `:` の直後から型表現を読み飛ばし、型の終わった位置を返す
function skipType(s, start) {
  const n = s.length;
  let i = start;
  let last = start;
  function balanced(open, close) {
    let d = 0;
    while (i < n) {
      const c = s[i];
      if (c === '"' || c === "'" || c === "`") { i = skipStringRaw(s, i); continue; }
      if (c === open) d++;
      else if (c === close) { d--; if (d === 0) { i++; return; } }
      i++;
    }
  }
  function term() {
    let j = i;
    while (j < n && /\s/.test(s[j])) j++;
    if (j >= n) return false;
    const c = s[j];
    if (c === '"' || c === "'") { i = skipStringRaw(s, j); }
    else if (c === "{") { i = j; balanced("{", "}"); }
    else if (c === "(") {
      i = j; balanced("(", ")");
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "=" && s[k + 1] === ">") { i = k + 2; if (!term()) return false; }
    }
    else if (/[\w$]/.test(c)) {
      i = j;
      while (i < n && /[\w$.]/.test(s[i])) i++;
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "<") { i = k; balanced("<", ">"); }
    }
    else if (/\d/.test(c) || (c === "-" && /\d/.test(s[j + 1] || ""))) {
      i = j + 1;
      while (i < n && /[\d.]/.test(s[i])) i++;
    }
    else return false;
    // 配列サフィックス number[] / T[][]
    while (true) {
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "[" && s[k + 1] === "]") { i = k + 2; } else break;
    }
    last = i;
    return true;
  }
  if (!term()) return last;
  while (true) {
    let k = i;
    while (k < n && /\s/.test(s[k])) k++;
    if (s[k] === "|" || s[k] === "&") { i = k + 1; if (!term()) break; }
    else break;
  }
  return last;
}

// 注釈（: 型 / 引数の ?）を文脈判定しながら除去する
function stripAnnotations(src) {
  const n = src.length;
  let out = "";
  let i = 0;
  const stack = [];   // "paren" | "block" | "object" | "bracket"
  const tern = [0];   // 深さごとの三項演算子カウント
  const isId = c => /[\w$]/.test(c);
  const ctx = () => stack.length ? stack[stack.length - 1] : "top";

  function prevInfo() {
    let j = out.length - 1;
    while (j >= 0 && /\s/.test(out[j])) j--;
    return { ch: j >= 0 ? out[j] : "", idx: j };
  }
  function wordEndingAt(idx) {
    let j = idx;
    while (j >= 0 && isId(out[j])) j--;
    return out.slice(j + 1, idx + 1);
  }
  function wordBeforeWord(idx) {
    let j = idx;
    while (j >= 0 && isId(out[j])) j--;
    while (j >= 0 && /\s/.test(out[j])) j--;
    const end = j;
    while (j >= 0 && isId(out[j])) j--;
    return out.slice(j + 1, end + 1);
  }

  while (i < n) {
    const c = src[i];
    if (c === '"' || c === "'" || c === "`") { const j = skipStringRaw(src, i); out += src.slice(i, j); i = j; continue; }
    if (c === "/" && (src[i + 1] === "/" || src[i + 1] === "*")) { const j = skipComment(src, i); out += src.slice(i, j); i = j; continue; }

    if (c === "(") { stack.push("paren"); tern.push(0); out += c; i++; continue; }
    if (c === "[") { stack.push("bracket"); tern.push(0); out += c; i++; continue; }
    if (c === "{") {
      const p = prevInfo();
      let kind = "block";
      if (["=", "(", ",", "[", ":", "?", "|", "&"].includes(p.ch)) kind = "object";
      else if (isId(p.ch)) {
        const w = wordEndingAt(p.idx);
        if (["return", "typeof", "in", "of", "new", "case"].includes(w)) kind = "object";
      }
      if (p.ch === ">" && p.idx > 0 && out[p.idx - 1] === "=") kind = "block"; // => { はアロー本体
      stack.push(kind); tern.push(0);
      out += c; i++; continue;
    }
    if (c === ")" || c === "]" || c === "}") {
      if (stack.length) { stack.pop(); tern.pop(); }
      out += c; i++; continue;
    }

    if (c === "?") {
      if (src[i + 1] === ".") { out += "?."; i += 2; continue; }
      if (src[i + 1] === "?") { out += "??"; i += 2; continue; }
      let k = i + 1;
      while (k < n && /\s/.test(src[k])) k++;
      const p = prevInfo();
      if (ctx() === "paren" && isId(p.ch) && (src[k] === ":" || src[k] === "," || src[k] === ")")) {
        i++; continue; // オプショナル引数の ? を除去
      }
      tern[tern.length - 1]++;
      out += c; i++; continue;
    }

    if (c === ":") {
      if (tern[tern.length - 1] > 0) { tern[tern.length - 1]--; out += c; i++; continue; }
      const cx = ctx();
      if (cx === "object" || cx === "bracket") { out += c; i++; continue; }
      const p = prevInfo();
      let ann = false;
      if (p.ch === ")") ann = true; // 戻り値の型
      else if ((p.ch === "}" || p.ch === "]") && cx === "paren") ann = true; // 分割代入引数の注釈
      else if (isId(p.ch)) {
        const w = wordEndingAt(p.idx);
        if (cx === "paren") ann = w !== "case";
        else if (w !== "default") {
          const before = wordBeforeWord(p.idx);
          if (["const", "let", "var"].includes(before)) ann = true; // 変数宣言の注釈
        }
      }
      if (ann) { i = skipType(src, i + 1); continue; }
      out += c; i++; continue;
    }

    out += c; i++;
  }
  return out;
}

// enum → ただのオブジェクトに変換（値なしは 0,1,2… の自動連番）
function transformEnums(src) {
  return src.replace(
    /(^|[\n;])([ \t]*)(export\s+)?enum\s+([\w$]+)\s*\{([^{}]*)\}/g,
    (m, pre, ind, _exp, name, body) => {
      let next = 0;
      const entries = body.split(",").map(e => e.trim()).filter(Boolean).map(e => {
        const eq = e.indexOf("=");
        if (eq >= 0) {
          const k = e.slice(0, eq).trim();
          const v = e.slice(eq + 1).trim();
          const num = Number(v);
          if (!Number.isNaN(num)) next = num + 1;
          return k + ": " + v;
        }
        return e + ": " + (next++);
      });
      return pre + ind + "const " + name + " = { " + entries.join(", ") + " };";
    });
}

function stripTypes(src) {
  let s = src;
  // enum → オブジェクト
  s = transformEnums(s);
  // interface ブロック（ネスト1段まで）
  s = s.replace(/(^|[\n;])[ \t]*(export\s+)?interface\s+[\w$]+(\s+extends\s+[\w$.,<>\s]+?)?\s*\{[^{}]*(\{[^{}]*\}[^{}]*)*\}/g, "$1");
  // type エイリアス
  s = s.replace(/(^|[\n;])[ \t]*(export\s+)?type\s+[\w$]+(\s*<[^<>]*>)?\s*=\s*(\{[^{}]*\}|[^;{}\n])*;?/g, "$1");
  // as キャスト
  s = s.replace(/\s+as\s+const\b/g, "");
  s = s.replace(/\s+as\s+[\w$.]+(\s*<[^<>]*>)?(\s*\[\s*\])*/g, "");
  // function 宣言のジェネリクスパラメータ
  s = s.replace(/\b(function\s+[\w$]+)\s*<[^<>]*>/g, "$1");
  s = stripAnnotations(s);
  // 空行の掃除（interface/type を抜いた跡）
  return s.replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "");
}

/* ---- 進捗（localStorage） ---- */
const SAVE = "shakyo_ts_done_v1";
const done = JSON.parse(localStorage.getItem(SAVE) || "{}");
const saveDone = () => localStorage.setItem(SAVE, JSON.stringify(done));

/* ---- 状態 ---- */
let L = LESSONS[0];      // 現在のレッスン
let model = "";          // お手本文字列
let auto = [];           // 自動スキップ（行頭インデント）フラグ
let pos = 0;             // 次に打つ位置
let started = 0;         // 開始時刻
let typed = 0;           // 打った文字数
let completed = false;

const $ = (id) => document.getElementById(id);
const codeEl = $("code");

function buildAuto(s){
  const a = new Array(s.length).fill(false);
  let lineStart = true;
  for (let i=0;i<s.length;i++){
    const ch = s[i];
    if (ch === "\n"){ a[i]=false; lineStart=true; }
    else if (lineStart && (ch===" "||ch==="\t")){ a[i]=true; }
    else { a[i] = ch.charCodeAt(0) > 126; lineStart=false; } // 非ASCII（日本語等）はIMEが要るので自動スキップ
  }
  return a;
}

function skipAuto(){ while(pos<model.length && auto[pos]) pos++; }

function load(lesson){
  L = lesson;
  model = lesson.code;
  auto = buildAuto(model);
  pos = 0; started = 0; typed = 0; completed = false;
  skipAuto();
  $("lessonTitle").textContent = lesson.title;
  $("note").textContent = lesson.note;
  $("banner").textContent = "";
  $("stat").textContent = "";
  codeEl.classList.remove("completed","err");
  $("frame").style.display="none"; $("hint").style.display="block"; $("runlabel").textContent="";
  $("jscard").style.display="none";
  renderCode();
  renderChips();
  codeEl.focus();
}

function renderCode(){
  let html = "";
  for (let i=0;i<model.length;i++){
    let ch = model[i];
    let disp = ch === "\n" ? "↵\n" : ch;
    // HTMLエスケープ
    disp = disp.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    let cls = "ch";
    if (auto[i]) cls = "auto";
    if (i < pos) cls = auto[i] ? "auto" : "done";
    if (i === pos) cls += " cur";
    html += '<span class="'+cls+'">'+disp+'</span>';
  }
  // 末尾カーソル（完成時）
  if (pos >= model.length) codeEl.classList.add("completed");
  codeEl.innerHTML = html;
  const cur = codeEl.querySelector(".cur");
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest"});
}

function flashErr(){
  codeEl.classList.add("err");
  setTimeout(()=>codeEl.classList.remove("err"),180);
}

function advance(){
  pos++; typed++;
  skipAuto();
  if (pos >= model.length) finish();
  renderCode();
}

function back(){
  if (pos<=0) return;
  pos--;
  while(pos>0 && auto[pos]) pos--;
  renderCode();
}

function finish(){
  completed = true;
  const sec = started ? ((Date.now()-started)/1000) : 0;
  $("banner").textContent = "完成！型が剥がれる 🎉";
  $("stat").textContent = typed + " 打 / " + sec.toFixed(1) + " 秒";
  if (!done[L.id]){ done[L.id]=true; saveDone(); renderChips(); }
  run();
}

/* ---- 実行（型を剥がして、iframe に流し込む） ---- */
function shell(lesson, code){
  const stage = lesson.stage
    ? '<canvas id="stage" width="320" height="240"></canvas>' : "";
  return '<!doctype html><html><head><meta charset="utf-8"><style>'
    + 'html,body{margin:0;height:100%;background:#0d0d12;color:#eee;'
    + 'font-family:system-ui,sans-serif;display:flex;flex-direction:column;'
    + 'align-items:center;justify-content:center;gap:14px}'
    + '#app{font-size:30px;text-align:center;line-height:1.4}'
    + 'canvas{background:#000;border-radius:10px}'
    + 'button{font-size:16px;padding:10px 18px;border-radius:10px;border:0;'
    + 'background:#ff5c8a;color:#111;font-weight:700;cursor:pointer}'
    + '</style></head><body>' + stage + '<div id="app"></div>'
    + '<scr'+'ipt>try{' + code + '}catch(e){document.body.innerHTML='
    + '"<pre style=\'color:#ff4d5e;padding:16px\'>"+e+"</pre>";}<\/scr'+'ipt>'
    + '</body></html>';
}

function run(){
  $("hint").style.display="none";
  const f = $("frame");
  f.style.display="block";
  const js = stripTypes(L.code);
  f.srcdoc = shell(L, js);
  $("jsout").textContent = js;
  $("jscard").style.display="block";
}

/* ---- キー入力 ---- */
codeEl.addEventListener("keydown", (e)=>{
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (completed && e.key!=="Backspace") return;

  if (e.key === "Backspace"){ e.preventDefault(); back(); return; }

  let ch;
  if (e.key === "Enter") ch = "\n";
  else if (e.key === "Tab"){ e.preventDefault(); return; }
  else if (e.key.length === 1) ch = e.key;
  else return; // 矢印・Shift 等は無視

  e.preventDefault();
  if (!started) started = Date.now();

  if (pos < model.length && ch === model[pos]){
    advance();
  } else {
    flashErr();
  }
});

/* ---- レッスン一覧 ---- */
function renderChips(){
  const box = $("chips"); box.innerHTML="";
  LESSONS.forEach((les)=>{
    const c = document.createElement("div");
    c.className = "chip" + (les.id===L.id ? " active":"");
    c.innerHTML = les.title + (done[les.id] ? '<span class="ck">✓</span>' : "");
    c.onclick = ()=>load(les);
    box.appendChild(c);
  });
}

/* ---- ボタン ---- */
$("peek").onclick = ()=>{ $("runlabel").textContent="（完成形）"; run(); codeEl.focus(); };
$("reset").onclick = ()=>load(L);

/* ---- 起動 ---- */
load(LESSONS[0]);
</script>
