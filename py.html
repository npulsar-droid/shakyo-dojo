<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写経道場 Python</title>
<style>
  :root{
    --bg:#0c0c11; --panel:#15151d; --line:#26263340; --ink:#e9e9f0;
    --dim:#6b6b7d; --pink:#ff5c8a; --cyan:#5cc8ff; --green:#7cffb0;
    --yellow:#ffd15c; --err:#ff4d5e;
    --mono:"SF Mono", Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;}
  header{padding:18px 20px 6px;}
  h1{margin:0;font-size:20px;letter-spacing:.04em}
  h1 span{color:var(--pink)}
  h1 .py{color:#111;background:var(--yellow);border-radius:6px;
    padding:1px 7px;font-size:13px;margin-left:8px;vertical-align:2px}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .sub a{color:var(--cyan);text-decoration:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.active{border-color:var(--pink);color:var(--pink)}
  .chip .ck{color:var(--green);margin-left:6px}
  main{display:flex;gap:16px;padding:8px 20px 32px;flex-wrap:wrap}
  .col{flex:1 1 380px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{margin:0;font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .note{color:var(--dim);font-size:12.5px;padding:10px 16px 0;line-height:1.6}
  /* code 写経 */
  .code{font-family:var(--mono);font-size:14px;line-height:1.75;padding:14px 16px 18px;
    white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text;tab-size:2;min-height:180px}
  .code:focus{box-shadow:inset 0 0 0 2px #ff5c8a33}
  .code .ch{color:var(--dim)}
  .code .done{color:var(--ink)}
  .code .auto{color:#3a3a4a}
  .code .jp{color:#55556a}
  /* インデント深さの見える化（4スペース＝1段で色が変わる） */
  .code .i0{color:#ff5c8a55}
  .code .i1{color:#5cc8ff55}
  .code .i2{color:#7cffb055}
  .code .i3{color:#ffd15c55}
  .code .cur{background:var(--pink);color:#111;border-radius:2px}
  .code.completed .cur{background:transparent;color:var(--ink)}
  .code.err .cur{background:var(--err);color:#fff;animation:shake .18s}
  @keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .bar{display:flex;gap:10px;align-items:center;padding:0 16px 14px;flex-wrap:wrap}
  .btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .btn.p{background:var(--pink);color:#111}
  .btn.g{background:#23232e;color:var(--ink);border:1px solid var(--line)}
  .stat{color:var(--dim);font-size:12px;margin-left:auto}
  .banner{color:var(--green);font-weight:700;font-size:13px}
  /* result: print 出力ターミナル */
  .out{font-family:var(--mono);font-size:14.5px;line-height:1.8;color:var(--green);
    background:#0d0d12;min-height:300px;margin:0;padding:16px 18px;white-space:pre-wrap;display:none}
  .out.error{color:var(--err)}
  .hint{color:var(--dim);font-size:12px;text-align:center;padding:120px 20px;background:#0d0d12}
  .boot{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  footer{color:var(--dim);font-size:11.5px;text-align:center;padding:0 20px 24px}
</style>
</head>
<body>
<header>
  <h1>写経<span>道場</span><span class="py">Python</span></h1>
  <div class="sub">お手本の Python を、一字ずつ写す。写し終えたら —— ブラウザの中の Python が、本当に実行する。<a href="index.html">JavaScript へ →</a>　<a href="ts.html">TypeScript へ →</a></div>
</header>
<div class="chips" id="chips"></div>
<main>
  <div class="col">
    <div class="card">
      <h2><span id="lessonTitle">—</span><span class="banner" id="banner"></span></h2>
      <div class="note" id="note"></div>
      <div class="code" id="code" tabindex="0"></div>
      <div class="bar">
        <button class="btn g" id="peek">完成形をチラ見 👀</button>
        <button class="btn g" id="reset">やり直す ↺</button>
        <span class="stat" id="stat"></span>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <h2>print 出力 <span class="stat" id="runlabel"></span></h2>
      <div class="hint" id="hint">写し終える（or チラ見）と、ここに出るよ 🐍</div>
      <pre class="out" id="out"></pre>
    </div>
  </div>
</main>
<footer>写経道場 Python · 単一HTML＋Pyodide（CDN） · 初回起動だけネットで Python 本体を取得 · 薄い字（インデント・日本語）は自動で進む · 進捗は自動保存</footer>

<script>
"use strict";

/* ---- お手本（自己完結して print する小さな Python） ---- */
const LESSONS = [
  { id:"hello", title:"其の一 · はじめの print",
    note:"まずは挨拶。print は「画面に出せ」の号令。日本語の部分（薄い字）は IME が要るので、自動で進む。",
    code:
`print("Hello, 道場")
print("ようこそ、写経の間へ")` },

  { id:"kuku", title:"其の二 · for で九九の七の段",
    note:"range(1, 10) は 1〜9。f\"...\" の中の {} には、式がそのまま入る。行頭の色つき点々がインデント＝for の中にいる印。",
    code:
`for i in range(1, 10):
    print(f"7 x {i} = {7 * i}")` },

  { id:"fizzbuzz", title:"其の三 · if / elif / else で FizzBuzz",
    note:"3で割れたら Fizz、5で Buzz、両方で FizzBuzz。Python は括弧の代わりに、インデントの深さでブロックを表す。点々2列目＝if の中。",
    code:
`for n in range(1, 16):
    if n % 15 == 0:
        print("FizzBuzz")
    elif n % 3 == 0:
        print("Fizz")
    elif n % 5 == 0:
        print("Buzz")
    else:
        print(n)` },

  { id:"func", title:"其の四 · def で関数を定義",
    note:"def で自分の命令を作り、return で値を返す。作った greet は、何度でも呼べる。",
    code:
`def greet(name):
    return "こんにちは、" + name + "さん"

print(greet("写経人"))
print(greet("Python"))` },

  { id:"comp", title:"其の五 · リスト内包表記",
    note:"[n for n in nums if n % 2 == 0] ＝「nums の中から、偶数だけ集めて新しいリスト」。一行で、選別が終わる。",
    code:
`nums = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]
evens = [n for n in nums if n % 2 == 0]
print("もと:", nums)
print("偶数:", evens)` },
];

/* ---- 進捗（localStorage） ---- */
const SAVE = "shakyo_py_done_v1";
function loadDone(){
  // 壊れた値やストレージ禁止（プライベートモード等）でも、進捗なしで動かす
  try {
    const v = JSON.parse(localStorage.getItem(SAVE) || "{}");
    return v && typeof v === "object" ? v : {};
  } catch (e) { return {}; }
}
const done = loadDone();
const saveDone = () => { try { localStorage.setItem(SAVE, JSON.stringify(done)); } catch (e) {} };

/* ---- 状態 ---- */
let L = LESSONS[0];      // 現在のレッスン
let model = "";          // お手本文字列
let auto = [];           // 自動スキップ（行頭インデント・非ASCII）フラグ
let indent = [];         // 行頭スペースのインデント段数（-1 = 行頭以外）
let pos = 0;             // 次に打つ位置
let started = 0;         // 開始時刻
let typed = 0;           // 打った文字数
let completed = false;

const $ = (id) => document.getElementById(id);
const codeEl = $("code");

function buildAuto(s){
  const a = new Array(s.length).fill(false);
  const ind = new Array(s.length).fill(-1);
  let lineStart = true;
  let lead = 0;
  for (let i=0;i<s.length;i++){
    const ch = s[i];
    if (ch === "\n"){ a[i]=false; lineStart=true; lead=0; }
    else if (lineStart && (ch===" "||ch==="\t")){ a[i]=true; ind[i]=Math.floor(lead/4); lead++; }
    else {
      // 非ASCII（日本語など）は IME が必要なので自動スキップ
      a[i] = ch.charCodeAt(0) > 126;
      lineStart=false;
    }
  }
  auto = a; indent = ind;
}

function skipAuto(){ while(pos<model.length && auto[pos]) pos++; }

function load(lesson){
  L = lesson;
  model = lesson.code;
  buildAuto(model);
  pos = 0; started = 0; typed = 0; completed = false;
  skipAuto();
  $("lessonTitle").textContent = lesson.title;
  $("note").textContent = lesson.note;
  $("banner").textContent = "";
  $("stat").textContent = "";
  codeEl.classList.remove("completed","err");
  $("out").style.display="none"; $("hint").style.display="block";
  $("hint").textContent = "写し終える（or チラ見）と、ここに出るよ 🐍";
  pendingRun = false; // 前の課題の「起動後に実行」予約を持ち越さない
  if (bootState === "ready") setRunLabel(readyLabel(), false);
  renderCode();
  renderChips();
  codeEl.focus();
}

function renderCode(){
  let html = "";
  for (let i=0;i<model.length;i++){
    const ch = model[i];
    let disp = ch === "\n" ? "↵\n" : ch;
    let cls = "ch";
    if (auto[i]){
      if (indent[i] >= 0){ disp = "·"; cls = "auto i" + (indent[i] % 4); } // インデント＝色つき点
      else cls = "jp";                                                     // 日本語など
    }
    if (i < pos && !auto[i]) cls = "done";
    if (i === pos) cls += " cur";
    // HTMLエスケープ
    disp = disp.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    html += '<span class="'+cls+'">'+disp+'</span>';
  }
  // 末尾カーソル（完成時）
  if (pos >= model.length) codeEl.classList.add("completed");
  codeEl.innerHTML = html;
  const cur = codeEl.querySelector(".cur");
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest"});
}

function flashErr(){
  codeEl.classList.add("err");
  setTimeout(()=>codeEl.classList.remove("err"),180);
}

function advance(){
  pos++; typed++;
  skipAuto();
  if (pos >= model.length) finish();
  renderCode();
}

function back(){
  if (pos<=0) return;
  if (completed){ // 完成後に消したら、もう一度打てる状態に戻す
    completed = false;
    codeEl.classList.remove("completed");
    $("banner").textContent = ""; $("stat").textContent = "";
  }
  pos--;
  while(pos>0 && auto[pos]) pos--;
  renderCode();
}

function finish(){
  completed = true;
  const sec = started ? ((Date.now()-started)/1000) : 0;
  $("banner").textContent = "完成！実行！ 🎉";
  $("stat").textContent = typed + " 打 / " + sec.toFixed(1) + " 秒";
  if (bootState === "ready") setRunLabel(readyLabel(), false); // チラ見の「（完成形）」表示を消す
  if (!done[L.id]){ done[L.id]=true; saveDone(); renderChips(); }
  run();
}

/* ============ Pyodide（ブラウザ内 Python） ============
   CDN: v314.0.2（実装時の stable）。loadPyodide → setStdout({batched}) → runPython */
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.js";
let pyodide = null;
let bootState = "idle";   // idle | loading | ready（失敗したら idle に戻して再挑戦できるようにする）
let pendingRun = false;

function setRunLabel(t, boot){
  const el = $("runlabel");
  el.textContent = t;
  el.className = "stat" + (boot ? " boot" : "");
}

function readyLabel(){
  return "Python " + (pyodide.version ? "v" + pyodide.version + " " : "") + "準備OK 🐍";
}

async function initPyodide(){
  try {
    pyodide = await loadPyodide();
    bootState = "ready";
    setRunLabel(readyLabel(), false);
    if (pendingRun){ pendingRun = false; run(); }
  } catch (e) {
    bootState = "idle"; // 再挑戦できるように戻す（以前は "failed" のまま「起動中…」で止まっていた）
    setRunLabel("起動失敗", false);
    showOut("Python の起動に失敗した…\n" + e + "\n「やり直す ↺」→ もう一度完成させると、起動をやり直す。", true);
  }
}

function bootPyodide(){
  if (bootState !== "idle") return;
  bootState = "loading";
  setRunLabel("🐍 Python を起動中…", true);
  if (typeof loadPyodide === "function"){ initPyodide(); return; } // スクリプトは読み込み済み
  const sc = document.createElement("script");
  sc.src = PYODIDE_URL;
  sc.onload = initPyodide;
  sc.onerror = () => {
    setRunLabel("起動失敗", false);
    showOut("Pyodide を読み込めなかった。\n初回起動には、ネット接続が必要（CDN から Python 本体を取得）。\nつないでから「やり直す ↺」→ もう一度完成させてみて。", true);
    bootState = "idle"; // 再挑戦できるように戻す
  };
  document.head.appendChild(sc);
}

function showOut(text, isError){
  $("hint").style.display="none";
  const o = $("out");
  o.style.display="block";
  o.classList.toggle("error", !!isError);
  o.textContent = text;
}

function run(){
  if (bootState !== "ready"){
    pendingRun = true;
    $("hint").style.display="block"; $("out").style.display="none";
    $("hint").innerHTML = '<span class="boot">🐍 Python を起動中…（初回は数秒〜十数秒。終わったら自動で実行）</span>';
    bootPyodide();
    return;
  }
  const lines = [];
  pyodide.setStdout({ batched: (msg) => lines.push(msg) });
  pyodide.setStderr({ batched: (msg) => lines.push(msg) });
  try {
    pyodide.runPython(L.code);
    showOut(lines.length ? lines.join("\n") : "（出力なし）", false);
  } catch (e) {
    showOut(String(e.message || e), true);
  }
}

/* ---- キー入力 ---- */
codeEl.addEventListener("keydown", (e)=>{
  // Cmd / Ctrl のショートカットは素通し。ただし AltGr（Windows では Ctrl+Alt 扱い）や
  // Mac の Option で打つ記号（ドイツ語配列などの { [ | ）は受け付ける
  if (e.metaKey || (e.ctrlKey && !e.altKey)) return;
  if (e.altKey && !e.ctrlKey && /^[a-z0-9]$/i.test(e.key)) return; // Windows の Alt+英字（メニュー操作）
  if (completed && e.key!=="Backspace") return;

  if (e.key === "Backspace"){ e.preventDefault(); back(); return; }

  let ch;
  if (e.key === "Enter") ch = "\n";
  else if (e.key === "Tab"){ e.preventDefault(); return; }
  else if (e.key.length === 1) ch = e.key;
  else return; // 矢印・Shift 等は無視

  e.preventDefault();
  if (!started) started = Date.now();

  if (pos < model.length && ch === model[pos]){
    advance();
  } else {
    flashErr();
  }
});

/* ---- レッスン一覧 ---- */
function renderChips(){
  const box = $("chips"); box.innerHTML="";
  LESSONS.forEach((les)=>{
    const c = document.createElement("div");
    c.className = "chip" + (les.id===L.id ? " active":"");
    c.textContent = les.title;
    if (done[les.id]){
      const ck = document.createElement("span");
      ck.className = "ck"; ck.textContent = "✓";
      c.appendChild(ck);
    }
    c.onclick = ()=>load(les);
    box.appendChild(c);
  });
}

/* ---- ボタン ---- */
$("peek").onclick = ()=>{ setRunLabelPeek(); run(); codeEl.focus(); };
function setRunLabelPeek(){ if (bootState === "ready") setRunLabel("（完成形）", false); }
$("reset").onclick = ()=>load(L);

/* ---- 起動 ---- */
load(LESSONS[0]);
bootPyodide(); // 先読み：写経している間に Python を温めておく
</script>
</body>
</html>
